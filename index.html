<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豬肝紅冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+Thai:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="src/opening.css">
</head>
<body>
<div id="wrap">
  <aside id="side" aria-label="狀態">
    <canvas id="por" width="96" height="64"></canvas>
    <div id="money" class="row3"></div>
    <div id="place"></div>
    <div id="look"></div>
    <div id="stats"></div>
    <div id="tip"></div>
    <div id="menu" hidden>
      <button id="mAttr">屬性</button><button id="mBag">背包</button>
      <button id="mPhone">手機</button><button id="mPass">護照</button>
      <button id="mNote">筆記</button><button id="mSave">日記與存檔</button>
    </div>
  </aside>
  <main id="main">
    <div id="col">
      <div id="scene"></div>
      <div id="text" aria-live="polite"></div>
      <div id="ch"></div>
    </div>
  </main>
</div>
<div id="ov" hidden><div id="ovb"></div></div>
<div id="toast" aria-live="polite"></div>
<script type="module" src="src/opening.js"></script>
</body>
</html>
