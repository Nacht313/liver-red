<title>豬肝紅冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+Thai:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: DoL-style text game — fixed status sidebar left, scene banner + story + numbered choices right. Single committed dark look. */
:root{
  --bg:#141218; --side:#1b1920; --panel:#221f29; --line:#34303d; --ink:#e9e3d7; --dim:#9c95a6;
  --link:#8db4ea; --linkh:#b9d2f5; --liver:#8e3434; --liver2:#b84a4a; --gold:#d8b46a;
  --ok:#6cc27a; --mid:#c9c25a; --warn:#e0954a; --bad:#e05a5a; --blue:#6aa8e0;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-pix:"DotGothic16","Noto Sans TC",monospace;
  --f-story:"Noto Serif TC","Songti TC",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.75}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#wrap{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%}
/* sidebar */
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:0;position:sticky;top:0;height:100vh;overflow-y:auto}
#por{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;background:#000}
.row3{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--f-pix);font-size:13px;font-variant-numeric:tabular-nums}
.row3 .k{color:var(--dim)}
.row3 .r{text-align:right}
#place{padding:6px 12px 0;font-weight:700;text-align:center}
#look{padding:4px 14px 8px;text-align:center;font-size:13.5px;line-height:1.6;color:var(--ink)}
#stats{display:flex;flex-direction:column;padding:0 10px}
.st{display:grid;grid-template-columns:3.2em 1fr;gap:6px;align-items:baseline;font-size:13.5px;padding-top:3px}
.st .lb{text-align:right;color:var(--ink);font-weight:500}
.st .bar{grid-column:1/-1;height:3px;background:#2c2833;position:relative;margin-bottom:2px}
.st .bar i{position:absolute;inset:0 auto 0 0}
.st .bar b{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(45deg,#4a2a2a 0 3px,#2c2833 3px 6px)}
#tip{margin:10px 12px;font-size:13px;line-height:1.6}
#tip .t{color:var(--gold);font-weight:700}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:4px 10px 12px}
#menu button{background:var(--panel);padding:9px 4px;font-weight:500}
#menu button:hover{background:#2c2834}
#menu .wide{grid-column:1/-1}
/* main */
#main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
#col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#scene{border-radius:6px;overflow:hidden;line-height:0;background:#000;box-shadow:0 0 0 1px var(--line)}
#scene svg{width:100%;height:auto;display:block;aspect-ratio:640/260}
#text p{margin:0 0 .9em;max-width:62ch}
#text .story{font-family:var(--f-story);font-size:17px;line-height:2;letter-spacing:.02em}
#text .sys{color:var(--dim);font-size:13.5px}
#text .say{color:#f0d9a8}
#text .good{color:var(--ok)}#text .bad{color:var(--bad)}#text .warn{color:var(--warn)}
#text b{color:#fff}
.grp{font-weight:700;margin:6px 0 2px}
#ch{display:flex;flex-direction:column;gap:2px}
.c{display:flex;align-items:center;gap:8px;text-align:left;color:var(--link);padding:3px 4px;border-radius:3px;width:100%}
.c:hover:not(:disabled){color:var(--linkh);background:#ffffff08}
.c img{width:20px;height:20px;image-rendering:pixelated;flex-shrink:0}
.c .n{font-family:var(--f-pix);font-size:13px;color:var(--dim);flex-shrink:0;min-width:2.2em}
.c .x{color:var(--dim);font-size:13px;margin-left:auto;text-align:right;padding-left:12px}
.c:disabled{color:#6d6677;cursor:not-allowed}
.c:disabled img{opacity:.4}
.gap{height:10px}
/* tables in packing etc */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:3px 4px;font:inherit;font-size:13px;max-width:9.5em}
.meter{height:6px;background:#2c2833;position:relative;margin-top:3px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--blue)}
.meter.o i{background:var(--bad)}
.lyr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lyr>div{background:var(--panel);border:1px solid var(--line);padding:8px 10px;font-size:13px;line-height:1.5}
.lyr .h{font-weight:700}
.note{border-left:3px solid var(--liver2);background:var(--panel);padding:8px 12px;font-size:13.5px;line-height:1.65}
/* overlay panel */
#ov{position:fixed;inset:0;background:rgba(8,6,12,.78);z-index:30;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
#ovb{background:var(--side);border:1px solid var(--line);width:100%;max-width:640px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
#ovb h2{margin:0;font-size:19px;color:var(--gold);font-weight:700}
#ovb h3{margin:6px 0 0;font-size:15px}
#ovb .close{align-self:flex-end;border:1px solid var(--line);padding:4px 14px;color:var(--dim)}
.attr{display:grid;grid-template-columns:4em 1fr 2em;gap:8px;align-items:center;font-size:14px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:8px;background:#2c2833}.pips i.on{background:var(--gold)}
.msg{background:var(--panel);border:1px solid var(--line);padding:8px 10px;font-size:13.5px;line-height:1.6}
.msg .f{color:var(--gold);font-size:12.5px;font-family:var(--f-pix)}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--liver2);color:var(--liver2);border-radius:50%;width:92px;height:92px;font-family:var(--f-pix);font-size:11px;line-height:1.3;text-align:center;transform:rotate(-8deg);margin:4px}
.stamp.tl{border-color:#5a8ad0;color:#5a8ad0;border-radius:8px}
/* day card (P5-ish) */
#day{position:fixed;inset:0;z-index:40;background:#0d0b10;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#day .band{position:absolute;left:-10%;right:-10%;top:28%;height:44%;background:var(--liver);transform:rotate(-7deg);box-shadow:0 0 0 10px #0d0b10,0 0 0 14px var(--ink)}
#day .in{position:relative;display:grid;gap:4px;justify-items:start;transform:rotate(-7deg);padding:0 24px}
#day .md{font-family:var(--f-pix);font-size:clamp(64px,16vw,132px);line-height:.9;color:#fff;letter-spacing:-.02em}
#day .wd{font-family:var(--f-pix);font-size:clamp(20px,5vw,34px);background:#fff;color:#0d0b10;padding:0 10px}
#day .ln{font-size:clamp(15px,3.6vw,20px);color:#fff;font-weight:700}
#day .ln span{color:var(--gold)}
#day .tap{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--dim);font-size:13px}
.title{font-family:var(--f-story);font-weight:700;font-size:clamp(40px,9vw,64px);color:var(--liver2);letter-spacing:.08em;line-height:1.1;margin:0}
.ver{font-family:var(--f-pix);color:var(--dim);font-size:12px}

#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,560px)}
#toast div{background:#2a2533;border:1px solid var(--gold);padding:7px 12px;font-size:13.5px;line-height:1.55;box-shadow:0 4px 16px #0008}
.w{font-family:"Noto Sans Thai",sans-serif;font-size:18px;color:var(--gold);border-bottom:2px dotted var(--gold);cursor:pointer;padding:0 2px;display:inline-block;line-height:1.5;text-align:center}
.w.got{color:var(--ink);border-bottom-color:var(--dim)}.w.ok{color:var(--ok);border-bottom:2px solid var(--ok)}
.w .gl{display:block;font-family:var(--f-body);font-size:11px;line-height:1;color:var(--ok)}
.thl{margin:.4em 0}.gest{color:var(--dim)}.th{font-family:"Noto Sans Thai",sans-serif;font-size:17px}
.mapscroll{overflow-x:auto;line-height:0}.mapw{position:relative;line-height:normal;background:#a6ccd6;min-width:620px}
.mapw canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.mpin{position:absolute;transform:translate(-7px,-50%);display:flex;align-items:center;gap:4px;font-family:var(--f-pix);font-size:12px;color:#1d1a22;padding:2px}
.mpin i{width:11px;height:11px;background:#3a3440;border:2px solid #fffbe9;display:block;flex-shrink:0}
.mpin span{background:#fffbe9;border:1px solid #1d1a22;padding:0 5px;white-space:nowrap}
.mpin.on i{background:var(--liver2)}.mpin.home i{background:#1d1a22}.mpin.sel span{background:var(--gold)}.mpin:hover span{background:#fff}
.pk{display:flex;flex-direction:column;gap:14px}
.bags{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:flex-start}
.lay .h{font-size:13.5px;font-weight:700}.lay .m{font-size:12px;color:var(--dim);line-height:1.4}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--c),34px);grid-template-rows:repeat(var(--r),34px);background:#0f0d13;border:2px solid #4a4356;margin-top:4px;width:max-content}
.cell{width:34px;height:34px;border:1px solid #2a2532;padding:0}
.cell:hover:not(:disabled){background:#2e2838}.cell:disabled{background:repeating-linear-gradient(45deg,#1a1720 0 4px,#120f17 4px 8px)}
.cell.no{background:#5a2a2a}
.it{position:absolute;border:2px solid #0f0d13;border-radius:4px;font-size:10.5px;line-height:1.2;color:#1b1820;padding:2px 3px;text-align:left;overflow:hidden;font-weight:500}
.it.sel,.chip.sel{outline:3px solid var(--gold);outline-offset:-1px}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:4px 9px;border-radius:4px;font-size:12.5px;color:#1b1820;font-weight:500}
.duel{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.doubt{display:inline-flex;gap:3px;vertical-align:middle}.doubt i{width:14px;height:9px;background:#2c2833}.doubt i.on{background:var(--bad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);padding:4px 12px;background:var(--panel)}.tabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.wordrow{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.wordrow input{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px 8px;font:inherit;min-width:0;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:var(--panel);padding:5px 12px;font-size:13.5px}.mini:disabled{opacity:.45}
.scroll{line-height:0}.scroll svg{width:100%;height:auto;display:block;aspect-ratio:640/260}
.polaroid{background:#f4efe4;padding:10px 10px 6px;max-width:420px;transform:rotate(-2deg);box-shadow:0 6px 20px #0008;margin:6px 0 14px;line-height:0}
.polaroid svg{width:100%;height:auto;display:block;aspect-ratio:640/260}.polaroid div{line-height:1.6;color:#2a2430;font-family:var(--f-pix);font-size:12px;padding-top:6px}


.board{--cell:40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px;background:#2a2230;line-height:normal;align-items:start}
@media(max-width:760px){.board{grid-template-columns:1fr}}
.board .bed{background:repeating-linear-gradient(90deg,#ebe4d6 0 18px,#e4dccc 18px 36px);border-radius:10px;padding:10px 10px 14px;min-height:170px;box-shadow:inset 0 0 0 3px #d2c8b4;transition:box-shadow .15s}
.board .bed.hot{box-shadow:inset 0 0 0 3px var(--gold)}
.board .bt{font-size:12px;color:#7a6e5e;margin-bottom:6px;font-weight:700}
.board .bedin{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.board .empty{color:#9a8e7c;font-size:13px}
.board .it{position:absolute;touch-action:none;cursor:grab;border-radius:6px;padding:2px;user-select:none;-webkit-user-select:none;border:0}
.board .it.free{position:relative;background:#ffffff80}
.board .it.must::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#e05a5a}
#scene .board .it svg{width:100%;height:100%;aspect-ratio:auto;display:block;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35));pointer-events:none}
.board .it:hover{background:rgba(255,255,255,.2)}
.board .it.lift{opacity:.25}
.board .gear{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.board .pack{position:relative;background:linear-gradient(180deg,#7d4e2e,#5e3820);border-radius:46px 46px 20px 20px;padding:30px 14px 16px;box-shadow:inset 0 -6px 0 #4a2a16,0 6px 14px #0007;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.board .handle{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:54px;height:22px;border:5px solid #4a2a16;border-bottom:0;border-radius:20px 20px 0 0}
.board .pack::before,.board .pack::after{content:"";position:absolute;top:44px;bottom:34px;width:8px;background:#3e2414;border-radius:4px}
.board .pack::before{left:-6px}.board .pack::after{right:-6px}
.board .lab{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:#f3e3c8;font-weight:700;margin-bottom:3px}
.board .lab em{font-style:normal;font-weight:400;color:#f3e3c8a0;font-size:10.5px}
.board .grid{position:relative;display:block;background-color:#3c2414;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:var(--cell) var(--cell);border-radius:6px;box-shadow:inset 0 2px 6px #0008;width:calc(var(--c)*var(--cell));height:calc(var(--r)*var(--cell));border:0;margin:0}
.board .grid.locked{opacity:.55}
.board .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#f3e3c8b0}
.board .col2{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.board .daypack{background:linear-gradient(180deg,#3d5a8a,#2c446c);border-radius:22px 22px 12px 12px;padding:14px 10px 10px;box-shadow:0 5px 12px #0006}
.board .daypack .grid{background-color:#1f3150}
.board .body{background:#3a3440;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.board .body .grid{background-color:#26222c}
.board .fp{position:absolute;border-radius:6px;pointer-events:none;z-index:3}
.board .fp.ok{background:rgba(108,194,122,.35);box-shadow:inset 0 0 0 2px #6cc27a}.board .fp.no{background:rgba(224,90,90,.35);box-shadow:inset 0 0 0 2px #e05a5a}
.board .pkfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;color:var(--ink);font-size:13px}
.board .kg b{font-size:20px;font-family:var(--f-pix)}.board .kg.warn b{color:var(--warn)}.board .kg.bad b{color:var(--bad)}
.board .sub{color:var(--dim)}.board .chip2.warn{color:var(--warn)}
.board .info{margin-left:auto;color:var(--dim);font-size:12.5px}
.ghost{position:fixed;z-index:80;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.ghost svg{width:100%;height:100%;display:block}
.cklist{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.ck{font-size:13px;border:1px solid var(--line);padding:3px 10px;border-radius:14px;color:var(--dim)}.ck.ok{color:var(--ok);border-color:#3c5a40}
#phone{position:fixed;inset:0;z-index:45;background:rgba(6,5,10,.72);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.phwrap{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;max-height:860px;justify-content:center}
.ph{width:min(390px,94vw);height:min(800px,calc(100% - 46px));background:#0a0a0c;border-radius:54px;padding:11px;box-shadow:0 0 0 2px #3b3742,0 0 0 4px #1a181e,0 24px 70px #000c}
.scr{position:relative;height:100%;border-radius:44px;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column;font-size:15px;line-height:1.4}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#000;border-radius:20px;z-index:5}
.sbar{height:52px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0 34px;font-weight:600;font-size:15px;position:relative;z-index:4}
.sbr{display:flex;align-items:center;gap:5px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px}.bars i{width:3px;background:#fff;border-radius:1px}.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8.5px}.bars i:nth-child(4){height:11px}
.nt{font-size:12.5px}.wf{width:17px;height:12px;color:#fff}.pctx{font-size:12.5px}.bolt{font-size:11px;margin-left:-3px}
.bat{position:relative;width:25px;height:12px;border-radius:3.5px;border:1.2px solid #ffffff99;display:inline-block}
.bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;background:#fff;border-radius:1.5px;max-width:calc(100% - 3px)}
.bat.chg i{background:#30d158}.bat.low i{background:#ff453a}
.scr.hm{background:radial-gradient(120% 80% at 30% 0%,#e8865a 0%,#8e3a5a 45%,#2a1d48 100%)}
.wall{flex:1;display:flex;flex-direction:column;padding:4px 20px 0;min-height:0}
.wdg{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:22px;padding:14px 16px;margin:8px 0 20px}
.wd1{font-size:13px;opacity:.85}.wd2{font-size:17px;margin:4px 0 2px}.wd3{font-size:12px;opacity:.75}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff}
.ai{position:relative;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 6px #0004}
.ai svg{width:32px;height:32px}
.ai em{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.ai em.g{background:#30d158}
.an{font-size:11.5px;text-shadow:0 1px 2px #0008}
.dock{margin-top:auto;margin-bottom:26px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:30px;padding:12px 16px;display:flex;justify-content:space-around}
.dock .an{display:none}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 14px 10px;border-bottom:.5px solid #38383a;gap:6px}
.pbk{color:#0a84ff;font-size:16px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntitle{font-weight:600;font-size:16px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nr{text-align:right}
.pbody{flex:1;overflow-y:auto;background:#000;padding:10px 14px 40px;min-height:0}
.pg{background:#1c1c1e;border-radius:12px;overflow:hidden}
.psh{font-size:12.5px;color:#8e8e93;margin:16px 6px 6px}
.pft{font-size:12px;color:#8e8e93;margin:6px 8px 0;line-height:1.5}

const DOW='日一二三四五六';
function dt(day){return new Date(Date.UTC(2030,5,28+day));}
function dateStr(day,short){const d=dt(day);return short?`${d.getUTCMonth()+1}/${d.getUTCDate()}`:`20XX/${d.getUTCMonth()+1}/${d.getUTCDate()} 星期${DOW[d.getUTCDay()]}`;}
function seg(h){return h<5?'深夜':h<12?'上午':h<18?'下午':h<23?'晚上':'深夜';}
function clock(h){const H=Math.floor(h)%24,M=Math.round((h%1)*60);return `${String(H).padStart(2,'0')}:${String(M===60?0:M).padStart(2,'0')}`;}
function tod(){const h=S.h;return h<6?'night':h<8?'dawn':h<17?'day':h<19.5?'dusk':'night';}
function hot(){return S.loc!=='home'&&S.loc!=='plane';}
function advance(hours,o={}){
 let left=hours;
 while(left>0){const st=Math.min(1,left);left-=st;
  const sl=o.sleep;
  if(S.loc==='home'){S.food=Math.max(S.food,Math.min(cap('food'),80));}else addS('food',-(sl?1:2.2)*st);
  if(!sl)addS('energy',-(o.tiring||1.6)*st*(o.weight?wf():1)*(S.hyg<45?1.2:1)*(S.food<30?1.2:1));
  if(!sl)S.hyg=clamp(S.hyg-(hot()?2.2:1.2)*st*(o.tiring?1.3:1),0,100);
  if(!o.charging)S.battery=clamp(S.battery-(o.phone||.8)*st,0,100);else S.battery=clamp(S.battery+25*st,0,100);
  S.family=clamp(S.family+.12*st+(S.msgs.filter(m=>!m.done).length*.08*st),0,100);
  S.h+=st; if(S.h>=24){S.h-=24;S.day++;onNewDay();}
 }
 checkLocks();
}

}

function layerSum(l){let kg=0,L=0;for(const id in S.items)if(S.items[id]===l){kg+=ITEMS[id].kg;L+=ITEMS[id].L;}return {kg,L};}
function bigUsed(){return ['top','mid','bot'].some(l=>layerSum(l).L>0);}
function totalKg(){let k=0;for(const id in S.items)if(carried(id))k+=ITEMS[id].kg;if(bigUsed())k+=PACK_KG;if(layerSum('day').L>0)k+=DAY_KG;return k;}
function cabinKg(){let k=0;for(const id in S.items){const l=S.items[id];if(l&&LAYERS[l]&&!LAYERS[l].body)k+=ITEMS[id].kg;}if(bigUsed())k+=PACK_KG;if(layerSum('day').L>0)k+=DAY_KG;return k;}
function badCenter(){return ['top','bot'].some(l=>Object.keys(S.items).some(id=>S.items[id]===l&&ITEMS[id].kg>=1));}

 }

/* P5 式日期卡 */
function dayCard(extra){
 const w=['晴','雷陣雨','多雲'][S.day%3];S.flags.rain=w==='雷陣雨';
 const d=dt(S.day);
 const el=$('#day');el.hidden=false;

}
function demoEnd(extra){

}

/* 結局／死亡 */
function end(title,text,kind){
 if(S.over)return;S.over=true;
 const hard=kind==='cs';
 show({img:'dark',zone:'home',isEnd:1,text:`<h2 style="color:var(--bad);margin:0 0 10px">${title}</h2>`+P(text,'story')+P(hard?'這是一個壞結局。你只能回到最近的入境章，或者從頭開始。旅行知識會保留。':'旅行知識會保留到下一次。','sys'),
 ch:[...(!hard&&SAVES.diary?[{t:`回到日記：${SAVES.diary.label}`,ico:'pen',fn:()=>load('diary')}]:[]),
  ...(SAVES.stamp?[{t:`回到入境章：${SAVES.stamp.label}`,ico:'star',fn:()=>load('stamp')}]:[]),
  {t:'重新開始',ico:'pass',fn:open1},{t:'回到標題',ico:'back',fn:titleScreen}]});
}

function fits(id,l,x,y,r){if(!layerOpen(l))return false;const [c,rr]=GRID[l];const [w,h]=dims(id,r);if(x<0||y<0||x+w>c||y+h>rr)return false;const g=occ(l);for(let j=0;j<h;j++)for(let i=0;i<w;i++){const o=g[y+j][x+i];if(o&&o!==id)return false;}return true;}

function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;}
let MAPC=null;
function mapCells(){if(MAPC)return MAPC;const seeds=[];for(const k in CTRY)CTRY[k].s.forEach(s=>seeds.push([s[0],s[1],k]));const out=[];const st=MAPV.step;
 for(let lat=MAPV.lat1-st/2;lat>MAPV.lat0;lat-=st)for(let lon=MAPV.lon0+st/2;lon<MAPV.lon1;lon+=st){if(!LAND.some(p=>pip(lon,lat,p))||WATER.some(p=>pip(lon,lat,p)))continue;let b=1e9,k='';const cl=Math.cos(lat*Math.PI/180);for(const s of seeds){const d=((s[0]-lon)*cl)**2+(s[1]-lat)**2;if(d<b){b=d;k=s[2];}}out.push([lon,lat,k]);}
 return MAPC=out;}
const mx=lon=>(lon-MAPV.lon0)/(MAPV.lon1-MAPV.lon0)*MAPV.W, my=lat=>(MAPV.lat1-lat)/(MAPV.lat1-MAPV.lat0)*MAPV.H;
function known(k){const c=CTRY[k];return c&&(!c.res||S.researched.includes(c.res));}
function drawMap(sel){
 const cv=document.getElementById('mapc');if(!cv)return;const x=cv.getContext('2d');
 x.fillStyle='#a6ccd6';x.fillRect(0,0,MAPV.W,MAPV.H);
 x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=1;for(let lo=30;lo<150;lo+=10){x.beginPath();x.moveTo(mx(lo)+.5,0);x.lineTo(mx(lo)+.5,MAPV.H);x.stroke();}for(let la=0;la<60;la+=10){x.beginPath();x.moveTo(0,my(la)+.5);x.lineTo(MAPV.W,my(la)+.5);x.stroke();}
 const tones=['#efe6cf','#e6d9bb','#f3ebd8','#ddcfb2'],keys=Object.keys(CTRY);
 const cw=MAPV.step/(MAPV.lon1-MAPV.lon0)*MAPV.W,ch=MAPV.step/(MAPV.lat1-MAPV.lat0)*MAPV.H;
 const selC=sel?CITIES.find(c=>c.id===sel).c:null;
 for(const [lon,lat,k] of mapCells()){const c=CTRY[k];let col=tones[keys.indexOf(k)%4],fog=false;if(c.st){if(known(k))col=ST_COL[c.st];else{col='#cdc6bb';fog=true;}}
  const px=mx(lon)-cw/2,py=my(lat)-ch/2;x.fillStyle=col;x.fillRect(px+.5,py+.5,cw-1,ch-1);
  if(fog&&((Math.round(lon/MAPV.step)+Math.round(lat/MAPV.step))%3===0)){x.fillStyle='#a49c90';x.fillRect(px+2,py+2,2,2);}
  if(k===selC){x.strokeStyle='#1d1a22';x.lineWidth=1;x.strokeRect(px+.5,py+.5,cw-1,ch-1);}}

function eat(n,meal){if(pageDone('market'))n=Math.round(n*1.15);addS('food',n);S.ate=(S.ate||0)+n;if(meal)unlock('hunger');}
function lock(src,stat,capv,how){if(S.locks.some(l=>l.src===src))return;S.locks.push({src,stat,cap:Math.max(50,capv),how,fresh:1});['energy','food','faith'].forEach(k=>S[k]=Math.min(S[k],cap(k)));toast(`上限被鎖住了：${how}可以解鎖。`);}
function checkLocks(){
 if(S.family>=100)lock('family','faith',75,'和家人視訊');
 if(S.energy<=0&&!S.over)return end('你撐不住了','連續的奔波讓你在路邊坐了很久。你打開航空公司的 App，訂了回國的單程機票。','tired');
 if(S.faith<=0&&!S.over)return end('你想回家了','你在床上躺了一整天，什麼都不想做。第二天，你告訴爸媽你要回去了。','faith');
}
function onNewDay(){
 S.rToday=0;
 if(S.loc==='home')S.hyg=95;
 if(S.loc!=='home'&&S.loc!=='transit'&&S.loc!=='plane'){if((S.ate||0)<60)S.lowDays=(S.lowDays||0)+1;else S.lowDays=0;}
 S.ate=0;
 S.locks.forEach(l=>{if(l.src==='hunger'||l.src==='dirty'){if(l.fresh)l.fresh=0;else l.cap=Math.max(50,l.cap-5);}});
 if(S.lowDays>=2)lock('hunger','all',75,'好好吃一頓正餐');
 if(S.hyg<25)lock('dirty','faith',75,'洗澡、換乾淨的衣服');
 ['energy','food','faith'].forEach(k=>S[k]=Math.min(S[k],cap(k)));
 S.thoughts.forEach(t=>{if(t.got<t.need){t.got++;if(t.got>=t.need){S.attr.膽識++;S.flags.thoughtDone=1;}}});
 S.orders.forEach(o=>{if(!o.got&&S.day>=o.arrive&&S.loc==='home'){o.got=1;if(ITEMS[o.id].worn)S.items[o.id]='worn';else S.items[o.id]='home';}});
 if(S.loc==='home'&&S.day>=4&&!S.flags['nag'+S.day]){S.flags['nag'+S.day]=1;S.family=clamp(S.family+4,0,100);}
 if(S.day%2===0)pushMsg();
 if(S.entry!==null&&S.family<15&&!S.flags.gift){S.flags.gift=1;S.card+=300;pushMsg(['媽媽','給你轉了 300 塊，吃好一點。別省。']);}
}

function checkIn(){

function walkIn(kind,price){
 const late=S.h>=23||S.h<5;
 if(kind==='hostel'&&late&&R()<.5)return khaosan('<span class="warn">「Full, sorry.」青旅客滿了。</span>');
 payTHB(price);S.stay={kind,nights:1,thb:price,refund:false};S.flags.checkedIn=kind==='hostel'?'青旅床位':'民宿房間';
 roomScene(`你付了 ${price} 銖。比網上訂貴了一點，但至少今晚有床了。`);
}
function pimHome(){

function takePhoto(where){
 const golden=(S.h>=16.5&&S.h<18.8)||(S.h>=6&&S.h<7.5);const dev=has('camera')?25:has('gopro')?12:0;
 if(!dev){if(S.battery<3)return '手機沒電，拍不了。';addS('battery',-2);}
 const q=clamp(S.attr.手藝*7+(golden?25:0)+dev+Math.floor(R()*20)-(S.flags.rain?10:0),5,100);
 S.photos=S.photos||[];S.photos.push({where,q,day:S.day,golden});

}

function isTD(day){const w=dt(day).getUTCDay();return w>0&&w<6;}
function tdOf(day){let n=0;for(let d=0;d<=day;d++)if(isTD(d))n++;return n;}
function nrand(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function evOf(td){const r=rng(9001+td*31);if(r()>.38)return null;return {id:STK[Math.floor(r()*STK.length)].id,up:r()<.55,mag:.04+r()*.05,rumor:r()<.75,truth:r()<.7};}
function retOf(id,td){const s=STK.find(x=>x.id===id),r=rng(4242+td*97+id.charCodeAt(0)*13+id.charCodeAt(1));let x=s.d+s.v*nrand(r);const e=evOf(td);if(e&&e.id===id){const dir=(e.up?1:-1)*(e.rumor&&!e.truth?-1:1);x+=dir*e.mag;}const tr=S.traps&&S.traps[id+':'+td];if(tr!==undefined)x=tr;return clamp(x,-.1,.1);}
function closeOf(id,td){let p=STK.find(x=>x.id===id).p;for(let t=1;t<=td;t++)p=Math.round(p*(1+retOf(id,t))*100)/100;return p;}

function mOpen(){return sess()==='交易中';}
function frac(){const h=bjh();if(h<9.5)return 0;if(h<11.5)return (h-9.5)/4;if(h<13)return .5;if(h<15)return .5+(h-13)/4;return 1;}
function pNow(id){const td=tdOf(S.day);if(!isTD(S.day))return closeOf(id,td);const prev=closeOf(id,td-1),cl=closeOf(id,td),f=frac();if(f<=0)return prev;if(f>=1)return cl;const op=prev*(1+retOf(id,td)*.3),r=rng(77+td*7+Math.floor(f*16)*3+id.charCodeAt(0));const p=op+(cl-op)*f+(r()-.5)*prev*.012;return Math.round(clamp(p,prev*.9,prev*1.1)*100)/100;}

 PA=[];const [app,arg]=PH.st[PH.st.length-1];let scr;

function csChat(st){
 const h=CSH[st.k],q=PIMQ[st.round];
 const bub=st.log.map(b=>b.w==='s'?`<div class="sysb">${b.t}</div>`:`<div class="bub ${b.w==='me'?'me':''}">${b.t}</div>`).join('');
 const meter=`<div class="dmeter">${h.n} 的疑慮 <span class="doubt">${[...Array(10)].map((_,i)=>`<i class="${i<st.doubt?'on':''}"></i>`).join('')}</span></div>`;
 if(st.round>=3){
  if(!st.done){st.done=1;S.csTried[st.k]=1;st.ok=st.doubt<=0||(st.doubt<=2&&R()<.5);if(st.ok){S.cs='pim';S.stay=null;}st.log.push({w:'h',t:st.ok?'OK! You can stay with me for 2 nights 😊 My place is near Khao San.':'Sorry, I don\'t think it\'s a good fit this time. Good luck!'});}
  return {title:h.n,nr:'',body:meter+`<div class="chat">${st.log.map(b=>b.w==='s'?`<div class="sysb">${b.t}</div>`:`<div class="bub ${b.w==='me'?'me':''}">${b.t}</div>`).join('')}</div>`+`<div class="pctr">${pbtn(st.ok?'太好了':'好吧',()=>pset(null),'blue')}</div>`};
 }
 if(!st.asked){st.asked=1;st.log.push({w:'h',t:q.q.replace(/[「」]/g,'')});}
 const opts=q.o.map(([a,t,b])=>{let bonus=typeof b==='number'?b:0,tag='';if(b==='cam'){bonus=has('camera')||S.items.camera==='home'?20:has('gopro')||S.items.gopro==='home'?10:-10;tag=bonus<0?'只有手機照片':'用相機作品';}if(b==='lie'){bonus=20;tag='說謊';}const c=chanceOf(a,bonus);
  return `<button class="reply" data-a="${pact(()=>{pdrain(1);const roll=1+Math.floor(R()*100),win=roll<=c,crit=roll<=c/4;if(b==='lie'&&win)S.flags.lied=1;const d=crit?-4:win?-3:1;st.doubt+=d;if(!win)addS('faith',-2);st.log.push({w:'me',t:t.replace(/[「」]/g,'').replace(/^（說謊）/,'')});st.log.push({w:'s',t:`${a} ${c}%・擲出 ${roll}・${crit?'大成功':win?'成功':'失敗'}`});st.log.push({w:'h',t:(win?['That sounds lovely 😊','Oh, nice!','I like that!']:['Hmm, OK.','I see...','ok'])[st.round]});st.round++;st.asked=0;})}"><span>${t.replace(/[「」]/g,'')}</span><small>${a} ${S.attr[a]}・${c}%${tag?'・'+tag:''}</small></button>`;}).join('');
 return {title:h.n,body:meter+`<div class="chat">${bub}</div><div class="replies">${opts}</div>`,after:()=>{const b=document.querySelector('#phone .pbody');if(b)b.scrollTop=b.scrollHeight;}};
}
