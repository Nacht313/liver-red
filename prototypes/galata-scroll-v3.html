<title>加拉達橋黃昏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* 版面：上方一條可捲動的像素畫布舞台（HUD 疊在上面、互動卡從底部升起），下方是操作列和 spot 設定表 */
:root{
  --night:#15122b;      /* 頁面底 */
  --panel:#211d3d;      /* 面板 */
  --line:#3a3462;       /* 分隔線 */
  --paper:#f3e9d6;      /* 主要文字 */
  --mute:#a79fc0;       /* 次要文字 */
  --liver:#b5473e;      /* 豬肝紅，主色 */
  --gold:#f0b257;       /* 夕陽金，強調 */
  --sea:#6fa3c7;        /* 對話裡的土耳其語 */
  --good:#8cc68a; --bad:#e1786b;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-pix:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.6}
.app{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-size:22px;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{font-family:var(--f-pix);font-size:12px;color:var(--gold);letter-spacing:.08em;margin-left:8px}
.sub{color:var(--mute);font-size:13px;margin:0}
.stage{position:relative;height:clamp(300px,60vh,540px);border-radius:6px;overflow:hidden;background:#000;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{background:rgba(21,18,43,.78);border:1px solid rgba(243,233,214,.18);border-radius:4px;padding:3px 8px;font-size:12.5px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;backdrop-filter:blur(2px)}
.chip b{font-family:var(--f-pix);font-weight:400;font-size:13px;color:var(--gold)}
.chip .lbl{color:var(--mute)}
.bar{width:44px;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:rgba(243,233,214,.7);pointer-events:none;background:rgba(21,18,43,.55);padding:2px 8px;border-radius:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:linear-gradient(rgba(29,26,55,.97),rgba(21,18,43,.99));border-top:2px solid var(--liver);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:3px;background:var(--line);color:var(--paper);font-weight:500}
.sheet .body{margin:0;max-width:68ch}
.say{border-left:2px solid var(--sea);padding-left:10px;margin:2px 0;color:var(--paper)}
.w{color:var(--sea);border-bottom:1px dashed var(--sea);cursor:pointer;padding:0 1px}
.w.known{border-bottom-style:solid;cursor:help}
.w.known::after{content:"（" attr(data-m) "）";color:var(--mute);font-size:12px}
.choices{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.choices button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:rgba(243,233,214,.05);border:1px solid var(--line);color:var(--paper);font:inherit;padding:8px 10px;border-radius:4px;cursor:pointer}
.choices button:hover:not(:disabled){border-color:var(--gold);background:rgba(240,178,87,.08)}
.choices button:disabled{opacity:.45;cursor:not-allowed}
.choices .n{font-family:var(--f-pix);color:var(--gold);min-width:1.2em}
.choices .cost{margin-left:auto;font-size:12px;color:var(--mute)}
.choices .why{flex-basis:100%;font-size:12px;color:var(--bad);padding-left:2em}
.out{font-size:13.5px;color:var(--good)}
.out.bad{color:var(--bad)}
.pop{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--gold);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:170px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.pop p{margin:0 0 2px;font-size:12px;color:var(--mute)}
.pop button{font:inherit;font-size:13.5px;text-align:left;background:transparent;border:1px solid var(--line);color:var(--paper);padding:4px 8px;border-radius:3px;cursor:pointer}
.pop button:hover:not(:disabled){border-color:var(--gold)}
.pop button:disabled{opacity:.4;text-decoration:line-through}
.act{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;white-space:nowrap;font:inherit;font-size:13px;color:var(--paper);background:rgba(21,18,43,.88);border:1px solid var(--gold);border-radius:4px;padding:3px 9px 3px 4px;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
.act::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:var(--gold)}
.act kbd{font-family:var(--f-pix);font-size:11px;background:var(--gold);color:var(--night);border-radius:3px;padding:0 5px;line-height:17px}
@keyframes bob{50%{margin-top:-3px}}
@media (prefers-reduced-motion:reduce){.act{animation:none}}
.toast{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:var(--liver);color:#fff;font-size:13px;padding:4px 12px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls button{font:inherit;font-size:14px;background:var(--panel);color:var(--paper);border:1px solid var(--line);padding:7px 12px;border-radius:4px;cursor:pointer;min-height:38px}
.controls button:hover{border-color:var(--gold)}
.controls button[aria-pressed="true"]{border-color:var(--liver);background:rgba(181,71,62,.2)}
.controls .walk{font-family:var(--f-pix);min-width:52px}
.controls .sp{flex:1}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panels{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.panels{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}
.card .note{margin:0 0 10px;color:var(--mute);font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;letter-spacing:.04em;white-space:nowrap}
td.x{font-family:var(--f-pix);font-size:11px;color:var(--mute);white-space:nowrap}
.st{font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.st.hidden{background:#2b2848;color:var(--mute)}
.st.unseen{background:#3a3462;color:var(--paper)}
.st.seen{background:rgba(240,178,87,.2);color:var(--gold)}
.st.done{background:rgba(140,198,138,.2);color:var(--good)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.words li{background:rgba(111,163,199,.14);border:1px solid rgba(111,163,199,.35);border-radius:3px;padding:2px 8px;font-size:13px}
.words li.no{background:transparent;border-style:dashed;color:var(--mute)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos figure{margin:0;font-size:12px;color:var(--mute)}
.photos img{width:100%;aspect-ratio:16/10;object-fit:cover;image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;display:block}
.photos b{color:var(--gold);font-family:var(--f-pix);font-weight:400}
.empty{color:var(--mute);font-size:13px;margin:0}
.log{margin:0;padding-left:18px;font-size:13px;color:var(--mute);max-height:160px;overflow:auto}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

<div class="app">
  <header>
    <h1>加拉達橋・黃昏<small>ISTANBUL 19:30</small></h1>
    <p class="sub">捲軸場景測試：從埃米諾努走到卡拉柯伊。點畫面或 ← → 走路，走到記號旁按 E 或 Enter 互動。背景和道具由 Anima 生成，光影由程式統一。</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="伊斯坦堡加拉達橋黃昏場景"></canvas>
    <div class="hud" id="hud"></div>
    <div class="hint" id="hint">← → 走路・走到記號旁按 E 或 Enter 互動</div>
    <button class="act" id="act" hidden></button>
    <div class="toast" id="toast"></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>

  <div class="controls">
    <button class="walk" id="bl" aria-label="往左走">&lt;&lt;</button>
    <button class="walk" id="br" aria-label="往右走">&gt;&gt;</button>
    <button id="wait">站著等 10 分鐘</button>
    <button id="actBtn">互動（E）</button>
    <span class="sp"></span>
    <button id="dbg" aria-pressed="false">顯示 spot 範圍</button>
    <button id="reset">重新開始</button>
  </div>

  <div class="panels">
    <section class="card">
      <h3>Spot 設定表</h3>
      <p class="note">每個互動點的類型、怎麼觸發、出現條件和代價。狀態會跟著你的遊玩即時更新。</p>
      <div class="tbl"><table id="spotTable"></table></div>
    </section>
    <section class="card">
      <h3>筆記本</h3>
      <ul class="words" id="words"></ul>
      <h3>相片</h3>
      <div class="photos" id="photos"></div>
      <h3 style="margin-top:12px">經過</h3>
      <ol class="log" id="log"></ol>
    </section>
  </div>
</div>

function drawMosque(g,cx,base,s,col,four){
  g.fillStyle=col;
  g.fillRect(cx-30*s,base-14*s,60*s,14*s);
  const dome=(x,y,r)=>{g.beginPath();g.arc(x,y,r,Math.PI,0);g.fill()};
  dome(cx,base-14*s,15*s);dome(cx-19*s,base-12*s,9*s);dome(cx+19*s,base-12*s,9*s);
  for(const d of[-27,-10,10,27])dome(cx+d*s,base-14*s,3.5*s);
  g.fillRect(cx-.6*s,base-34*s,1.2*s,6*s);
  const mins=four?[-44,-36,36,44]:[-36,36];
  for(const m of mins){const h=(Math.abs(m)>40?40:48)*s;const x=cx+m*s;
    g.fillRect(x-1.2*s,base-h,2.4*s,h);g.fillRect(x-2*s,base-h*.62,4*s,1.2*s);g.fillRect(x-2*s,base-h*.8,4*s,1.2*s);

    // 環境時間：每 3 秒過 1 分鐘

function show(card){
  current=card;sheetOpen=true;const el=$('sheet');el.hidden=false;
  const ch=(card.choices||[]).map((c,i)=>{
    let why='';if(c.req&&!c.req())why=c.reqTxt||'條件不足';
    if(!why&&c.cost){if(c.cost.money&&S.money<c.cost.money)why='錢不夠';if(c.cost.bat&&S.bat<c.cost.bat)why='手機沒電了'}
    return`<li><button data-i="${i}" ${why?'disabled':''}><span class="n">${i+1}</span><span>${c.t}</span><span class="cost">${fmtCost(c.cost)}</span>${why?`<span class="why">${why}</span>`:''}</button></li>`}).join('');
  el.innerHTML=`<h2>${card.title}${card.tag?`<span class="tag">${card.tag}</span>`:''}</h2>${card.out?`<p class="out ${card.bad?'bad':''}">${say(card.out)}</p>`:''}<div class="body">${say(card.body||'')}</div><ul class="choices">${ch}</ul>`;
  el.querySelectorAll('.choices button').forEach(btn=>btn.onclick=()=>pick(+btn.dataset.i));
  el.querySelectorAll('.w[data-k]').forEach(w=>{w.onclick=e=>guess(w,e);w.onkeydown=e=>{if(e.key==='Enter')guess(w,e)}});
  const first=el.querySelector('.choices button:not(:disabled)');first&&first.focus({preventScroll:true});
}

function pick(i){const c=current.choices[i];pay(c.cost);const r=c.go&&c.go();sync();if(r)show(r);else close()}

function trigger(id,force){

let pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function guess(el,e){
  e.stopPropagation();closePop();const k=el.dataset.k;const right=WORDS[k];
  const pool=Object.values(WORDS).filter(v=>v!==right);const opts=[right];while(opts.length<3){const v=pool[Math.floor(Math.random()*pool.length)];if(!opts.includes(v))opts.push(v)}
  opts.sort(()=>Math.random()-.5);
  pop=document.createElement('div');pop.className='pop';
  pop.innerHTML=`<p>「${el.textContent}」是什麼意思？從情境猜。</p>`+opts.map(o=>`<button data-o="${o}">${o}</button>`).join('')+`<button data-o="__phone" ${S.bat<3?'disabled':''}>用手機翻譯（電量 3%）</button>`;
  const st=$('stage').getBoundingClientRect(), r=el.getBoundingClientRect();
  pop.style.left=Math.min(r.left-st.left,st.width-190)+'px';pop.style.top=Math.max(8,r.top-st.top-150)+'px';
  $('stage').appendChild(pop);
  pop.querySelectorAll('button').forEach(bt=>bt.onclick=ev=>{ev.stopPropagation();const o=bt.dataset.o;
    if(o==='__phone'){S.bat=clamp(S.bat-3,0,100);learn(k,'手機翻譯');closePop();show(current)}
    else if(o===right){S.mem+=1;learn(k,'猜對');closePop();show(current)}
    else{bt.disabled=true;toast('好像不是這個意思')}});
}

});
function arrive(){}
function nearSpot(){let best=null,bd=26;for(const s of SPOTS){if(s.x==null||s.trig!=='點擊'||stateOf(s)==='hidden')continue;const d=Math.abs(S.x-s.x);if(d<bd){bd=d;best=s}}return best}
function act(){if(sheetOpen||S.ended)return;const s=nearSpot();if(s){S.tx=null;walkHold=0;trigger(s.id)}}
let lastNear=null;
function prompt(){
  const el=$('act'),s=(!sheetOpen&&!S.ended)?nearSpot():null;
  if(!s){if(!el.hidden)el.hidden=true;lastNear=null;return}
  if(lastNear!==s.id){el.innerHTML=`<kbd>E</kbd>${s.name}`;lastNear=s.id;el.hidden=false}
  el.style.left=((s.x-camX)*cssU)+'px';el.style.top=((DECK-26)*cssH)+'px';
}
const keys={};
addEventListener('keydown',e=>{
  if(sheetOpen){const n=parseInt(e.key,10);if(n>=1&&n<=9&&current&&current.choices[n-1]){const b2=$('sheet').querySelectorAll('.choices button')[n-1];if(b2&&!b2.disabled)pick(n-1)}if(e.key==='Escape'&&current&&!current.tag?.includes('事件'))close();return}
  if((e.key==='e'||e.key==='E'||e.key==='Enter')&&!e.repeat&&nearSpot()){e.preventDefault();act();return}
  if(e.key==='ArrowLeft'){walkHold=-1;S.tx=null}if(e.key==='ArrowRight'){walkHold=1;S.tx=null}
});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&walkHold<0)walkHold=0;if(e.key==='ArrowRight'&&walkHold>0)walkHold=0});
for(const[id,d]of[['bl',-1],['br',1]]){const el=$(id);
  const on=e=>{e.preventDefault();if(!sheetOpen){walkHold=d;S.tx=null}},off=()=>{walkHold=0};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
$('act').onclick=e=>{e.stopPropagation();act()};$('actBtn').onclick=act;
$('wait').onclick=()=>{if(sheetOpen||S.ended)return;advance(10);S.en=clamp(S.en+2,0,100);log('站著等了 10 分鐘');sync()};
$('dbg').onclick=()=>{dbg=!dbg;$('dbg').setAttribute('aria-pressed',dbg);$('dbg').textContent=dbg?'隱藏 spot 範圍':'顯示 spot 範圍'};
function reset(){S=fresh();queue=[];closePop();sheetOpen=false;$('sheet').hidden=true;sync();log('回到埃米諾努碼頭')}
$('reset').onclick=reset;

/* ---------- 啟動 ---------- */
function start(data){if(data&&data.S)S=data.S;resize();sync();requestAnimationFrame(tick)}
window.claude?.hot?.snapshot?.(()=>({S}));
addEventListener('resize',resize);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
