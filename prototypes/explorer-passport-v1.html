<style>
/* Layout: one-screen handheld — HUD strip, pixel stage, dialogue slip, controls. Single deliberate night palette. */
:root{
  --ink:#17142a; --panel:#221d38; --panel2:#2c2647; --line:#3d3563;

  --f-thai:"Noto Sans Thai Looped","Noto Sans Thai",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.pix{font-family:var(--f-pix)}
#hud{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:2px solid var(--line);padding:8px 10px}
#hudTop{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-pix);font-size:13px;align-items:baseline;font-variant-numeric:tabular-nums}
#hudTop .k{color:var(--dim);margin-right:4px}
#hudTop .visa{color:var(--saffron)}
#bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px}
.bar{display:grid;grid-template-columns:4.2em 1fr 2.2em;gap:6px;align-items:center;font-size:12px}
.bar .lb{color:var(--dim);font-family:var(--f-pix)}
.bar .tr{height:8px;background:var(--ink);border:1px solid var(--line);position:relative}
.bar .fl{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.bar.low .fl{background:var(--red)}
.bar.fam .fl{background:var(--maroon)}
.bar.fam.low .fl{background:var(--red)}
.bar .v{font-family:var(--f-pix);text-align:right;font-variant-numeric:tabular-nums}
#stage{position:relative;border:2px solid var(--line);background:#000;line-height:0}
#cv{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#prompt{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--ink);border:2px solid var(--saffron);color:var(--paper);font-family:var(--f-pix);font-size:13px;line-height:1.3;padding:4px 10px;white-space:nowrap}
#toast{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;line-height:1.4;pointer-events:none}
#toast div{background:rgba(23,20,42,.92);border-left:3px solid var(--saffron);padding:4px 8px;font-size:13px;max-width:100%}
#dlg{background:var(--panel);border:2px solid var(--line);padding:10px 12px;min-height:64px;line-height:1.7}
#dlg .who{font-family:var(--f-pix);color:var(--saffron);font-size:13px;margin-bottom:2px}
.gest{color:var(--dim)}
.th{font-family:var(--f-thai);font-size:17px}
.w{font-family:var(--f-thai);font-size:18px;color:var(--saffron);border-bottom:2px dotted var(--saffron);cursor:pointer;padding:0 2px;position:relative;display:inline-block;line-height:1.5}
.w.got{color:var(--paper);border-bottom-color:var(--dim)}
.w.ok{color:var(--green);border-bottom-style:solid;border-bottom-color:var(--green)}
.w .gl{display:block;font-family:var(--f-body);font-size:11px;color:var(--green);line-height:1;text-align:center}
#controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}
#pad button,#acts button{background:var(--panel2);border:2px solid var(--line);font-family:var(--f-pix);font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad button:active,#acts button:active{background:var(--line)}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#acts{display:flex;gap:6px;flex-wrap:wrap}
#acts button{padding:8px 12px}
#acts .a{background:var(--saffron);color:var(--ink);border-color:var(--saffron);min-width:64px}
.keys{color:var(--dim);font-size:12px}
@media (hover:hover) and (pointer:fine){#pad{display:none}}

#modal{position:fixed;inset:0;background:rgba(10,8,22,.82);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:2px solid var(--line);width:100%;max-width:640px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 #0007}
.sheet h2{font-family:var(--f-pix);font-weight:400;font-size:22px;margin:0;color:var(--saffron);text-wrap:balance}
.sheet h3{font-family:var(--f-pix);font-weight:400;font-size:15px;margin:4px 0 0;color:var(--paper)}
.sheet p{margin:0;line-height:1.7;max-width:62ch}
.sub{color:var(--dim);font-size:13px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--line);padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--saffron)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .s{color:var(--dim);font-size:12px;text-align:right;flex-shrink:0;max-width:45%}
.close{align-self:flex-end;background:none;border:2px solid var(--line);padding:4px 12px;font-family:var(--f-pix)}
.btn{background:var(--saffron);color:var(--ink);border:none;padding:10px 18px;font-family:var(--f-pix);font-size:15px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.meter{height:10px;background:var(--ink);border:1px solid var(--line);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.meter.over i{background:var(--red)}
.warn{color:var(--red)}
.good{color:var(--green)}
.note{border-left:3px solid var(--teal);padding:6px 10px;background:var(--ink);font-size:13px;line-height:1.6}
.wordrow{display:grid;grid-template-columns:7em 1fr;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.wordrow input{background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:5px 8px;font:inherit;min-width:0;width:100%}
.page{border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot canvas{width:56px;height:56px;image-rendering:pixelated;background:var(--paper);border:2px solid var(--line)}
.slot select{width:100%;background:var(--panel2);color:var(--paper);border:1px solid var(--line);font-family:var(--f-thai);font-size:15px;padding:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:var(--panel2);border:2px solid var(--line);padding:5px 10px;font-family:var(--f-pix)}
.tabs button[aria-selected="true"]{border-color:var(--saffron);color:var(--saffron)}
.msg{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--ink)}
.msg .f{font-family:var(--f-pix);color:var(--saffron);font-size:12px}
.msg.done{opacity:.55}
.mini{background:var(--panel2);border:1px solid var(--line);padding:5px 10px;font-size:13px}
.mini:disabled{opacity:.4}
.title-art{font-family:var(--f-pix);font-size:clamp(34px,9vw,56px);line-height:1;color:var(--saffron);letter-spacing:.04em}
.passport{display:flex;gap:12px;align-items:center;background:var(--maroon);padding:12px;border:2px solid #000}
.passport .emb{width:44px;height:44px;border:2px solid var(--saffron);border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-family:var(--f-pix);color:var(--saffron)}
.passport .t{font-family:var(--f-pix);color:var(--saffron);font-size:13px;line-height:1.5}
.chk{display:grid;grid-template-columns:1.4em 1fr auto;gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk input{margin-top:3px}
.chk .r{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function lineHTML(tokens){return tokens.map(t=>{
 if(t[0]==='@'){const w=t.slice(1),st=S.words[w];const ok=st&&st.ok;return `<span class="w ${ok?'ok':st?'got':''}" data-w="${w}" role="button" tabindex="0">${w}${ok?`<span class="gl">${WORDS[w]}</span>`:''}</span>`;}
 if(t[0]==='（')return `<span class="gest">${esc(t)}</span>`;
 return `<span class="th">${esc(t)}</span>`;}).join('');}
function bindWords(root){root.querySelectorAll('.w').forEach(el=>{const f=()=>collect(el.dataset.w,el);el.onclick=f;el.onkeydown=e=>{if(e.key==='Enter')f();};});}

function tick(mins,o={}){
 const hrs=mins/60,h=hour();
 let w=5*(h>=11&&h<16?(page('body')?1.2:1.6):1);if(S.rainLeft>0)w*=.7;if(o.sleep)w*=.4;
 S.hunger-=3.6*hrs*(o.sleep?.5:1);S.water-=w*hrs;
 if(!o.sleep)S.energy-=2.4*hrs*(o.mult||1);
 S.mood-=.6*hrs+((S.hunger<20||S.water<20)?2*hrs:0);
 const unread=S.msgs.filter(m=>!m.done).length;
 S.family+=(.5+.45*unread)*hrs;
 if(S.hunger<=0)S.health-=6*hrs;if(S.water<=0)S.health-=9*hrs;if(S.energy<=0)S.health-=3*hrs;
 ['hunger','water','energy','mood','health','family'].forEach(k=>S[k]=clamp(S[k],0,100));
 S.nextMsg-=mins;if(S.nextMsg<=0){const f=FAM[Math.floor(rnd()*FAM.length)];S.msgs.unshift({from:f[0],text:f[1],done:false,day:day(),h:Math.floor(hour())});S.nextMsg=420+rnd()*480;toast(`📱 ${f[0]} 傳來新訊息（M 打開手機）`);}
 if(S.rainLeft>0)S.rainLeft-=mins;
 checkFail();
}

}
function sleep(kind){

 S.energy=kind==='dorm'||kind==='cs'?Q[0]:clamp(S.energy+Q[0],0,100);S.health=clamp(S.health+Q[1],0,100);mood(Q[2]);
 let extra='';
 if(kind==='street'&&S.thb>300&&rnd()<.4){const l=Math.round(S.thb*.4);S.thb-=l;S.stolen+=l;extra=` 醒來時，腰包被割開了，少了 ${l} 銖。`;}
 newDay();
 say('第 '+day()+' 天，08:00',Q[3]+extra);
 checkFail();
}

}

const iconCache={};
function iconURL(w){if(iconCache[w])return iconCache[w];const c=document.createElement('canvas');c.width=c.height=10;const g=c.getContext('2d');g.fillStyle='#f1e8d4';g.fillRect(0,0,10,10);const ic=ICONS[w];g.fillStyle=ic[8];ic.slice(0,8).forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==='#')g.fillRect(x+1,y+1,1,1);}));return iconCache[w]=c.toDataURL();}
function notebook(){
 const seen=Object.keys(S.words);
 const canPhrase=has('phrase')&&S.phraseDay!==day();
 const rows=seen.length?seen.map(w=>{const st=S.words[w];return `<div class="wordrow"><span class="w ${st.ok?'ok':'got'}" style="cursor:default">${w}</span>${st.ok?`<span class="good">${WORDS[w]}（已確認）</span>`:`<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><input id="g_${seen.indexOf(w)}" data-w="${w}" placeholder="你覺得是什麼意思？" value="${esc(st.guess)}">${st.hint?`<span class="sub">提示：${st.hint}</span>`:''}</div>`}</div>`;}).join(''):'<p class="sub">還沒有記下任何字。和人說話時，點對話裡有底線的泰文。</p>';
 const pages=PAGES.map(p=>{const done=page(p.id),ready=p.w.every(w=>S.words[w]);
  if(done)return `<div class="page"><h3 class="good">✓ ${p.n}</h3><p class="sub">${p.r}</p></div>`;
  if(!ready)return `<div class="page"><h3>${p.n}</h3><p class="sub">還缺 ${p.w.filter(w=>!S.words[w]).length} 個字才能拼出這一頁。</p></div>`;
  return `<div class="page" data-p="${p.id}"><h3>${p.n}</h3><p class="sub">把字放到對應的圖下面。三個全對才會確認。</p><div class="slots">${p.w.map((w,i)=>`<div class="slot"><img src="${iconURL(w)}" alt="" style="width:56px;height:56px;image-rendering:pixelated;border:2px solid var(--line)"><select id="s_${p.id}_${i}" aria-label="第 ${i+1} 張圖"><option value="">—</option>${seen.map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')}</div><button class="mini" data-chk="${p.id}">核對這一頁</button></div>`;}).join('');
 openModal(`<h2>語言筆記</h2><p class="sub">像《巴別塔聖歌》：沒有人會直接告訴你意思。從手勢和情境猜，寫下來，再用圖頁驗證。</p>
 ${has('phrase')?`<div class="row"><button class="mini" id="phr" ${canPhrase?'':'disabled'}>查泰語會話手冊</button><span class="sub">${canPhrase?'今天還能查 1 個字':'今天查過了'}</span></div>`:''}
 <h3>生字（${seen.length}/15）</h3><div>${rows}</div><h3>圖頁（${S.pages.length}/5）</h3><div style="display:flex;flex-direction:column;gap:8px">${pages}</div><button class="close">關閉 Esc</button>`);
 $('#sheet').querySelectorAll('input[data-w]').forEach(i=>i.oninput=()=>{S.words[i.dataset.w].guess=i.value;meta.guesses[i.dataset.w]=i.value;saveMeta();});
 const ph=$('#phr');if(ph)ph.onclick=()=>{const c=seen.filter(w=>!S.words[w].ok&&!S.words[w].hint);if(!c.length){toast('筆記裡的字你都查過了。');return;}const w=c[Math.floor(rnd()*c.length)];S.words[w].hint=WORDS[w];S.phraseDay=day();act(30);notebook();};
 $('#sheet').querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const p=PAGES.find(x=>x.id===b.dataset.chk);const ans=p.w.map((w,i)=>$(`#s_${p.id}_${i}`).value);
  if(ans.every((a,i)=>a===p.w[i])){S.pages.push(p.id);p.w.forEach(w=>{S.words[w].ok=true;S.words[w].guess=WORDS[w];meta.guesses[w]=WORDS[w];});saveMeta();mood(10);toast(`「${p.n}」這一頁確認了！${p.r}`);notebook();}
  else{const n=ans.filter((a,i)=>a===p.w[i]).length;toast(n>=2?'差一點。有兩個是對的……但不知道是哪兩個。':'不對。再回去聽聽當地人怎麼說。');}});
}

 if(nx>x0*T&&nx<x1*T&&ny>y0*T&&ny<y1*T&&!solid(Math.floor(nx/T),Math.floor(ny/T))){n.x=nx;n.y=ny;}else n.t=0;

function update(dt){

  P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  const tryMove=(nx,ny)=>{const pts=[[nx-4,ny-3],[nx+4,ny-3],[nx-4,ny],[nx+4,ny]];return pts.every(([x,y])=>!solid(Math.floor(x/T),Math.floor(y/T)));};
  const nx=P.x+dx*sp*dt,ny=P.y+dy*sp*dt;
  if(tryMove(nx,P.y))P.x=nx;if(tryMove(P.x,ny))P.y=ny;
  P.frame+=dt*8;S.energy=clamp(S.energy-sp*dt/T*.045*wf(),0,100);}
 NPC.forEach(n=>moveNPC(n,dt));
 const gm=dt*3; S.T+=gm; tick(gm);

}

 for(let y=y0;y<=y0+VH/T+1&&y<MH;y++)for(let x=x0;x<=x0+VW/T+1&&x<MW;x++)if(map[y][x]==='t')drawTile('t',x,y,x*T-camX,y*T-camY);
 BLD.forEach(drawBuilding);drawStall();
 drawTuk(16*T,16*T+4);
 // fence + gate of park
 for(let x=4;x<=14;x++)if(x!==9&&x!==10)R('#d8d0bd',x*T-camX,13*T-camY-2,T,3);
 const ents=[...NPC.map(n=>({y:n.y,f:()=>person(n.x,n.y,{skin:'#c58c5c',hair:n.hair,shirt:n.col,pants:'#2d2d3a',walk:!!(n.vx||n.vy)},n.vy<0?'up':n.vx>0?'right':n.vx<0?'left':'down',tt*6,n.pack?20:0)})),
  {y:P.y,f:()=>person(P.x,P.y,{skin:'#e3b98f',hair:'#1b1b1b',shirt:'#d9545a',pants:has('pants')?'#3a4a6a':'#5a6a8a',walk:P.moving},P.dir,P.frame,vol())}];
 ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
 // light
 const h=hour();let dark=h<5?.6:h<7?.6-(h-5)*.3:h<17.5?0:h<19.5?(h-17.5)*.3:.6;
 if(S.rainLeft>0)dark=Math.max(dark,.25);
 if(dark>0){cx.fillStyle=`rgba(14,12,40,${dark})`;cx.fillRect(0,0,VW,VH);
  if(dark>.3){BLD.forEach(b=>{if(b.kind)return;const dx=b.door*T-camX+8,dy=(b.y+b.h)*T-camY+4;const g=cx.createRadialGradient(dx,dy,2,dx,dy,30);g.addColorStop(0,'rgba(255,200,110,.28)');g.addColorStop(1,'rgba(255,200,110,0)');cx.fillStyle=g;cx.fillRect(dx-30,dy-30,60,60);});}}
 if(S.rainLeft>0){cx.fillStyle='rgba(180,200,230,.5)';for(let i=0;i<90;i++){const rx=(hsh(i,1)*VW+tt*40*(1+hsh(i,2)))%VW,ry=(hsh(i,3)*VH+tt*220)%VH;cx.fillRect(rx|0,ry|0,1,4);}}
 const n=nearby(),pr=$('#prompt');
 if(n&&$('#modal').hidden){const nm=n.npc?({passer:'路人',backpacker:'背包客',tuk:'嘟嘟車司機'}[n.npc.id]):n.spot.n;pr.textContent=`E　${n.npc?'和'+nm+'說話':'進入 '+nm}`;pr.hidden=false;}else pr.hidden=true;
}
function drawAttract(){
 for(let y=0;y<VH/T+1;y++)for(let x=0;x<VW/T+1;x++)drawTile(y>=6&&y<=8?'.':',',x+3,y+8,x*T-((tt*12)%T),y*T);
 cx.fillStyle='rgba(14,12,40,.4)';cx.fillRect(0,0,VW,VH);
}

/* ---------- HUD ---------- */
const BARS=[['hunger','飽足'],['water','水分'],['energy','體力'],['mood','心情'],['health','健康'],['family','家人壓力']];
$('#bars').innerHTML=BARS.map(b=>`<div class="bar ${b[0]==='family'?'fam':''}" id="b_${b[0]}"><span class="lb">${b[1]}</span><span class="tr"><span class="fl"></span></span><span class="v"></span></div>`).join('');
function hud(){
 if(!S){$('#hudTop').innerHTML='<span>探險者護照</span><span class="k">demo・曼谷</span>';return;}
 const h=hour(),hh=String(Math.floor(h)).padStart(2,'0'),mm=String(Math.floor((h%1)*60)).padStart(2,'0'),d=day();
 $('#hudTop').innerHTML=`<span><span class="k">第</span>${d}<span class="k"> 天</span> ${hh}:${mm}</span><span class="visa">${d<=30?`免簽剩 ${30-d+1} 天`:`逾期 ${d-30} 天`}</span><span>${Math.round(S.thb).toLocaleString()} ฿</span><span><span class="k">¥</span>${S.cny.toLocaleString()}</span><span><span class="k">卡</span>¥${S.card.toLocaleString()}</span><span><span class="k">$</span>${S.usd}</span><span><span class="k">背包</span>${kg().toFixed(1)}kg</span>${net()?'<span class="k">4G</span>':''}${S.rainLeft>0?'<span class="k">下雨</span>':''}`;
 BARS.forEach(([k])=>{const el=$('#b_'+k),v=S[k];el.querySelector('.fl').style.width=v+'%';el.querySelector('.v').textContent=Math.round(v);el.classList.toggle('low',k==='family'?v>=75:v<=25);});
}

/* ---------- 主迴圈 ---------- */
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();hudT+=dt;if(hudT>.2){hudT=0;hud();}requestAnimationFrame(loop);}
hud();intro();requestAnimationFrame(loop);
</script>
